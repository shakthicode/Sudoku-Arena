    // ============================================================
    // ADMIN DATA PANEL
    // ============================================================

    function AdminPage({ setPage }) {
      const [authed, setAuthed] = useState(false);
      const [creds, setCreds] = useState({ username: '', password: '' });
      const [authHeader, setAuthHeader] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [users, setUsers] = useState([]);
      const [games, setGames] = useState({});
      const [leaderboard, setLeaderboard] = useState([]);
      const [tab, setTab] = useState('users');
      const [fetching, setFetching] = useState(false);

      // Offline mode: read all user/game/leaderboard data from localStorage
      const [serverMode, setServerMode] = useState(null); // null=unknown, true=server, false=local

      function loadLocalData() {
        const accounts = LS.get('sv_accounts', {});
        const localUsers = Object.values(accounts).map(a => ({
          id: a.id || '—',
          username: a.username || '—',
          email: a.email || '—',
          avatar: a.avatar || '🧩',
          level: a.level || 1,
          rank: a.rank || 'Novice',
          xp: a.xp || 0,
          gamesPlayed: a.gamesPlayed || 0,
          totalScore: a.totalScore || 0,
          streak: a.streak || 0,
          createdAt: a.createdAt || null,
          lastLoginAt: a.lastLoginAt || null,
        }));
        const lb = LS.get('sv_leaderboard', []);
        setUsers(localUsers);
        setLeaderboard(lb);
        setGames({});
        setServerMode(false);
        setAuthed(true);
      }

      function handleAdminLogin(e) {
        e.preventDefault();
        setLoading(true);
        setError('');
        const token = btoa(`${creds.username}:${creds.password}`);

        // Try server first; gracefully fall back to localStorage on Netlify/static hosting
        fetch(`${API_BASE}/api/users`, {
          headers: { 'Authorization': `Basic ${token}` },
          signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined,
        })
          .then(async (res) => {
            if (res.ok) {
              const data = await res.json();
              setUsers(data.users || []);
              setAuthHeader(token);
              setServerMode(true);
              setAuthed(true);
              fetchRestData(token);
            } else {
              setError('Invalid admin credentials. Access denied.');
            }
          })
          .catch(() => {
            // Server unreachable (Netlify / static hosting) — fall back to localStorage
            loadLocalData();
          })
          .finally(() => {
            setLoading(false);
          });
      }

      async function fetchRestData(token) {
        setFetching(true);
        try {
          const [gRes, lRes] = await Promise.all([
            fetch(`${API_BASE}/api/games`, { headers: { 'Authorization': `Basic ${token}` } }),
            fetch(`${API_BASE}/api/leaderboard`),
          ]);
          if (gRes.ok) { const d = await gRes.json(); setGames(d.games || {}); }
          if (lRes.ok) { const d = await lRes.json(); setLeaderboard(d.leaderboard || []); }
        } catch (err) {
          console.error('Admin fetch error:', err);
        }
        setFetching(false);
      }

      function handleRefresh() {
        if (!serverMode) { loadLocalData(); return; }
        if (authHeader) {
          setFetching(true);
          fetch(`${API_BASE}/api/users`, {
            headers: { 'Authorization': `Basic ${authHeader}` }
          })
            .then(async (res) => {
              if (res.ok) {
                const data = await res.json();
                setUsers(data.users || []);
              }
            })
            .catch(console.error);
          fetchRestData(authHeader);
        }
      }

      if (!authed) {
        return (
          <div className="min-h-screen flex items-center justify-center pt-16 px-4">
            <div className="absolute inset-0 overflow-hidden">
              <div className="orb w-96 h-96 bg-red-500/10 top-1/4 left-1/4" />
              <div className="orb w-72 h-72 bg-primary/10 bottom-1/4 right-1/4" />
            </div>
            <div className="relative w-full max-w-sm" style={{ animation: 'bounceIn 0.5s ease-out' }}>
              <div className="text-center mb-8">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center text-2xl mx-auto mb-4 shadow-glow-error">🔐</div>
                <h1 className="text-2xl font-display font-bold text-white">Admin Access</h1>
                <p className="text-slate-500 text-sm mt-1">Restricted area — authorized personnel only</p>
              </div>
              <div className="glass rounded-2xl p-7 shadow-glass">
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" placeholder="Admin username"
                      value={creds.username} onChange={e => setCreds({ ...creds, username: e.target.value })}
                      className="form-input" autoComplete="off" />
                  </div>
                  <PasswordInput id="admin-password" label="Password" placeholder="••••••••"
                    value={creds.password}
                    onChange={e => setCreds({ ...creds, password: e.target.value })}
                    error="" autoComplete="current-password" />
                  {error && (
                    <div className="flex items-center gap-2 p-3 rounded-lg bg-red-900/30 border border-red-500/30 text-red-300 text-sm">
                      <span>🚫</span><span>{error}</span>
                    </div>
                  )}
                  <button type="submit" className="btn-primary w-full py-3 rounded-xl" style={{ background: 'linear-gradient(135deg, #DC2626, #B91C1C)' }}>
                    🔓 Authenticate
                  </button>
                </form>
                <button onClick={() => setPage('landing')} className="btn-ghost w-full mt-3 text-sm">← Back to Home</button>
              </div>
            </div>
          </div>
        );
      }

      const totalGames = Object.values(games).reduce((acc, g) => acc + g.length, 0);

      return (
        <div className="min-h-screen pt-20 pb-12 px-4" style={{ animation: 'fadeIn 0.4s ease-out' }}>
          <div className="max-w-6xl mx-auto space-y-6">

            {/* Admin Header */}
            <div className="glass rounded-2xl p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center text-2xl shadow-glow-error">🔐</div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-display font-bold text-white">Admin Data Panel</h1>
                    <span className="admin-badge text-xs uppercase tracking-wider">{serverMode ? 'Connected' : 'Offline Mode'}</span>
                  </div>
                  <p className="text-slate-500 text-sm">Logged in as <span className="text-red-400 font-semibold">{creds.username || 'Admin'}</span> · Read-only access</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={handleRefresh} disabled={fetching}
                  className="btn-secondary flex items-center gap-2 text-sm py-2">
                  {fetching ? <span className="animate-spin">⟳</span> : '🔄'} Refresh
                </button>
                <button onClick={() => setPage('landing')} className="btn-ghost text-sm">← Exit</button>
              </div>
            </div>

            {/* Offline Database Fallback Banner */}
            {!serverMode && (
              <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 p-4 rounded-xl bg-yellow-950/30 border border-yellow-500/30 text-yellow-300 text-sm">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">⚠️</span>
                  <div>
                    <h4 className="font-bold text-white mb-0.5">Static Offline Mode Fallback</h4>
                    <p className="text-yellow-200/80 text-xs">The Python backend server is unreachable. Admin panel is displaying user registration and game history synchronized to local storage (localStorage).</p>
                  </div>
                </div>
              </div>
            )}

            {/* Stats Overview */}
            {(() => {
              const onlineUsers = users.filter(u => {
                const lastActive = u.updatedAt || u.lastLoginAt;
                return lastActive && (new Date(lastActive).getTime() > Date.now() - 5 * 60 * 1000);
              }).length;

              const allGamesList = Object.values(games).flat();
              const completedGames = allGamesList.filter(g => g.status === 'completed' || g.won).length;
              const totalGamesCount = allGamesList.length;
              const completionRate = totalGamesCount > 0 ? Math.round((completedGames / totalGamesCount) * 100) : 0;

              return (
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
                  {[
                    { label: 'Total Users', val: users.length, icon: '👥', color: 'text-blue-400' },
                    { label: 'Active Today', val: users.filter(u => u.lastLoginAt && new Date(u.lastLoginAt) > new Date(Date.now() - 86400000)).length, icon: '⚡', color: 'text-purple-400' },
                    { label: 'Online Users', val: onlineUsers, icon: '🟢', color: 'text-green-400' },
                    { label: 'Games Played', val: totalGames, icon: '🎮', color: 'text-teal-400' },
                    { label: 'Completion Rate', val: `${completionRate}%`, icon: '📈', color: 'text-yellow-400' },
                  ].map(s => (
                    <div key={s.label} className="stat-card">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-slate-500 text-xs uppercase tracking-wider">{s.label}</span>
                        <span className="text-xl">{s.icon}</span>
                      </div>
                      <p className="text-2xl font-display font-bold text-white">{s.val}</p>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* Tabs */}
            <div className="flex gap-2 bg-slate-800/50 rounded-xl p-1 w-fit">
              {[['users', '👥 Users'], ['games', '🎮 Games'], ['leaderboard', '🏆 Rankings'], ['activity', '⚡ Activity']].map(([t, label]) => (
                <button key={t} onClick={() => setTab(t)}
                  className={`tab-btn text-sm px-5 ${tab === t ? 'active' : ''}`}>
                  {label}
                </button>
              ))}
            </div>

            {/* Users Table */}
            {tab === 'users' && (
              <div className="glass rounded-2xl overflow-hidden">
                <div className="px-6 py-4 border-b border-white/5 flex items-center justify-between">
                  <h2 className="font-display font-bold text-white flex items-center gap-2">👥 Registered Users <span className="text-xs text-slate-500 font-normal">({users.length} total)</span></h2>
                </div>
                <div className="admin-scroll">
                  {fetching ? (
                    <div className="text-center py-12 text-slate-400">
                      <span className="text-3xl animate-spin inline-block">⟳</span>
                      <p className="mt-2 text-sm">Loading data...</p>
                    </div>
                  ) : users.length === 0 ? (
                    <div className="text-center py-12">
                      <p className="text-4xl mb-2">📭</p>
                      <p className="text-slate-500 text-sm">No users registered yet</p>
                    </div>
                  ) : (
                    <table className="admin-table">
                      <thead><tr>
                        <th>#</th><th>Avatar</th><th>Username</th><th>Email</th><th>Level</th><th>Rank</th><th>XP</th><th>Games</th><th>Score</th><th>Streak</th><th>Joined</th>
                      </tr></thead>
                      <tbody>
                        {users.map((u, i) => (
                          <tr key={u.id}>
                            <td className="text-slate-600">{i + 1}</td>
                            <td><span className="text-xl">{u.avatar || '🧩'}</span></td>
                            <td><span className="font-semibold text-white">{u.username}</span></td>
                            <td className="text-slate-400">{u.email}</td>
                            <td><span className="font-bold text-blue-400">Lv.{u.level}</span></td>
                            <td><span className="text-xs font-semibold text-purple-300">{u.rank}</span></td>
                            <td className="text-yellow-400 font-semibold">{u.xp?.toLocaleString()}</td>
                            <td className="text-slate-300">{u.gamesPlayed || 0}</td>
                            <td className="text-green-400 font-semibold">{u.totalScore?.toLocaleString() || 0}</td>
                            <td className="text-orange-400">{u.streak || 0}🔥</td>
                            <td className="text-slate-500">{u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* Games Table */}
            {tab === 'games' && (
              <div className="glass rounded-2xl overflow-hidden">
                <div className="px-6 py-4 border-b border-white/5">
                  <h2 className="font-display font-bold text-white flex items-center gap-2">🎮 Game Records <span className="text-xs text-slate-500 font-normal">({totalGames} total)</span></h2>
                </div>
                <div className="admin-scroll">
                  {fetching ? (
                    <div className="text-center py-12 text-slate-400"><span className="text-3xl animate-spin inline-block">⟳</span><p className="mt-2 text-sm">Loading...</p></div>
                  ) : totalGames === 0 ? (
                    <div className="text-center py-12"><p className="text-4xl mb-2">🎮</p><p className="text-slate-500 text-sm">No games recorded yet</p></div>
                  ) : (
                    <table className="admin-table">
                      <thead><tr><th>User ID</th><th>Difficulty</th><th>Status</th><th>Score</th><th>Time</th><th>Mistakes</th><th>Hints</th><th>Saved At</th></tr></thead>
                      <tbody>
                        {Object.entries(games).flatMap(([uid, glist]) =>
                          (glist || []).map((g, i) => (
                            <tr key={`${uid}-${i}`}>
                              <td className="font-mono text-xs text-slate-500">{uid.slice(0, 8)}…</td>
                              <td><span className={`text-xs font-bold ${DIFFICULTY_CONFIG[g.difficulty]?.color || 'text-slate-300'}`}>{g.difficulty}</span></td>

                              <td className="text-yellow-400 font-semibold">{g.score?.toLocaleString() || '—'}</td>
                              <td className="text-slate-300">{g.timeElapsed ? `${Math.floor(g.timeElapsed / 60)}:${String(g.timeElapsed % 60).padStart(2, '0')}` : '—'}</td>
                              <td className={`font-semibold ${g.mistakesCount > 0 ? 'text-red-400' : 'text-slate-500'}`}>{g.mistakesCount || 0}</td>
                              <td className="text-slate-400">{g.hintsUsed || 0}</td>
                              <td className="text-slate-500 text-xs">{g.savedAt ? new Date(g.savedAt).toLocaleDateString() : '—'}</td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* Leaderboard Table */}
            {tab === 'leaderboard' && (
              <div className="glass rounded-2xl overflow-hidden">
                <div className="px-6 py-4 border-b border-white/5">
                  <h2 className="font-display font-bold text-white flex items-center gap-2">🏆 Leaderboard <span className="text-xs text-slate-500 font-normal">({leaderboard.length} entries)</span></h2>
                </div>
                <div className="admin-scroll">
                  {fetching ? (
                    <div className="text-center py-12 text-slate-400"><span className="text-3xl animate-spin inline-block">⟳</span><p className="mt-2 text-sm">Loading...</p></div>
                  ) : leaderboard.length === 0 ? (
                    <div className="text-center py-12"><p className="text-4xl mb-2">🏆</p><p className="text-slate-500 text-sm">Leaderboard is empty</p></div>
                  ) : (
                    <table className="admin-table">
                      <thead><tr><th>Rank</th><th>Avatar</th><th>Username</th><th>Score</th><th>Games</th></tr></thead>
                      <tbody>
                        {leaderboard.map((e, i) => (
                          <tr key={e.id || i}>
                            <td><span className="font-bold text-yellow-400">#{e.rank}</span></td>
                            <td><span className="text-xl">{e.avatar || '🧩'}</span></td>
                            <td className="font-semibold text-white">{e.username}</td>
                            <td className="text-yellow-400 font-bold">{e.score?.toLocaleString()}</td>
                            <td className="text-slate-400">{e.games}</td>

                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* Activity Feed Table */}
            {tab === 'activity' && (
              <div className="glass rounded-2xl overflow-hidden">
                <div className="px-6 py-4 border-b border-white/5 flex items-center justify-between">
                  <h2 className="font-display font-bold text-white flex items-center gap-2">⚡ Recent Activity Feed</h2>
                </div>
                <div className="p-6 space-y-3 admin-scroll max-h-[500px] overflow-y-auto">
                  {(() => {
                    const activities = [];
                    // Add registrations
                    users.forEach(u => {
                      if (u.createdAt) {
                        activities.push({
                          type: 'register',
                          user: u.username,
                          avatar: u.avatar,
                          time: new Date(u.createdAt),
                          desc: 'Registered a new account',
                        });
                      }
                      if (u.lastLoginAt) {
                        activities.push({
                          type: 'login',
                          user: u.username,
                          avatar: u.avatar,
                          time: new Date(u.lastLoginAt),
                          desc: 'Logged in to play',
                        });
                      }
                    });
                    // Add games
                    Object.entries(games).forEach(([uid, glist]) => {
                      const u = users.find(x => x.id === uid);
                      (glist || []).forEach(g => {
                        if (g.savedAt) {
                          activities.push({
                            type: 'game',
                            user: u ? u.username : `User ${uid.slice(0, 8)}`,
                            avatar: u ? u.avatar : '🧩',
                            time: new Date(g.savedAt),
                            desc: `Game ${g.status === 'completed' || g.won ? 'won' : g.status === 'in_progress' ? 'started' : 'lost'} (${g.difficulty}) with ${g.mistakesCount} mistakes`,
                          });
                        }
                      });
                    });

                    // Sort by time descending
                    activities.sort((a, b) => b.time - a.time);

                    if (activities.length === 0) {
                      return <p className="text-slate-500 text-sm text-center py-8">No recent activity detected.</p>;
                    }

                    return activities.slice(0, 25).map((act, idx) => (
                      <div key={idx} className="flex items-center justify-between p-3.5 rounded-xl bg-slate-900/40 border border-white/5">
                        <div className="flex items-center gap-3">
                          <span className="text-xl">{act.avatar}</span>
                          <div>
                            <span className="font-semibold text-white mr-2">{act.user}</span>
                            <span className="text-slate-400 text-xs">{act.desc}</span>
                          </div>
                        </div>
                        <span className="text-xs text-slate-500">{act.time.toLocaleTimeString()} {act.time.toLocaleDateString()}</span>
                      </div>
                    ));
                  })()}
                </div>
              </div>
            )}

            <p className="text-center text-xs text-slate-600">Admin panel — read-only view. Data stored in <code className="text-slate-500">data/*.json</code> · Secured with Basic Auth</p>
          </div>
        </div>
      );
    }

    // ============================================================
    // DAILY CHALLENGE PAGE
    // ============================================================

    function DailyChallengePage({ user, setPage, setIsDaily, dailyDifficulty }) {
      const [timeLeft, setTimeLeft] = useState(() => {
        const now = new Date();
        const midnight = new Date(now); midnight.setHours(24, 0, 0, 0);
        return Math.floor((midnight - now) / 1000);
      });

      useEffect(() => {
        const timer = setInterval(() => setTimeLeft(t => Math.max(t - 1, 0)), 1000);
        return () => clearInterval(timer);
      }, []);

      const h = Math.floor(timeLeft / 3600);
      const m = Math.floor((timeLeft % 3600) / 60);
      const s = timeLeft % 60;

      const today = new Date();
      const dateStr = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      const lb = loadLeaderboard();

      const diffCfg = DIFFICULTY_CONFIG[dailyDifficulty] || DIFFICULTY_CONFIG['Hard'];
      const bonusCfg = DAILY_BONUS[dailyDifficulty] || DAILY_BONUS['Hard'];

      return (
        <div className="min-h-screen pt-20 pb-12 px-4" style={{ animation: 'fadeIn 0.5s ease-out' }}>
          <div className="max-w-4xl mx-auto space-y-8">

            {/* Header */}
            <div className="glass rounded-2xl p-8 text-center relative overflow-hidden">
              <div className="absolute inset-0 bg-gradient-to-br from-yellow-900/20 to-orange-900/10" />
              <div className="relative">
                <div className="text-5xl mb-3">📅</div>
                <h1 className="text-4xl font-display font-black text-white mb-2">Daily Challenge</h1>
                <p className="text-yellow-400 font-medium mb-1">{dateStr}</p>

                {/* Today's difficulty badge — unique per user */}
                {user && (
                  <div className="flex items-center justify-center gap-3 mb-4 mt-3">
                    <div className={`inline-flex items-center gap-2 px-4 py-2 rounded-full border ${diffCfg.bg} ${diffCfg.border}`}>
                      <span className="text-lg">
                        {dailyDifficulty === 'Easy' ? '🌱' : dailyDifficulty === 'Medium' ? '🧩' : dailyDifficulty === 'Hard' ? '🔥' : dailyDifficulty === 'Expert' ? '🧠' : '👹'}
                      </span>
                      <span className={`font-display font-bold text-sm ${diffCfg.color}`}>{dailyDifficulty}</span>
                      <span className="text-slate-500 text-xs">· Today's difficulty</span>
                    </div>
                    <div className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-full bg-yellow-900/30 border border-yellow-500/30`}>
                      <span className="text-yellow-400 font-bold text-sm">{bonusCfg.label}</span>
                      <span className="text-yellow-500/80 text-xs">XP bonus</span>
                    </div>
                  </div>
                )}

                <p className="text-slate-400 text-sm max-w-lg mx-auto mb-6">
                  Your puzzle is seeded to today's date — different difficulty for each player. Earn a <strong className="text-yellow-300">{bonusCfg.label} XP multiplier</strong> for completing it!
                </p>
                <div className="flex items-center justify-center gap-3 mb-6">
                  {[{ val: h, lbl: 'hours' }, { val: m, lbl: 'minutes' }, { val: s, lbl: 'seconds' }].map((t, i) => (
                    <React.Fragment key={t.lbl}>
                      {i > 0 && <span className="text-slate-600 font-bold text-2xl">:</span>}
                      <div className="glass-light rounded-xl px-4 py-3 text-center min-w-[60px]">
                        <p className="text-2xl font-display font-bold text-white">{t.val.toString().padStart(2, '0')}</p>
                        <p className="text-xs text-slate-500">{t.lbl}</p>
                      </div>
                    </React.Fragment>
                  ))}
                </div>
                <p className="text-slate-500 text-xs mb-4">New puzzle resets in ↑</p>
                {user ? (
                  <button onClick={() => { setIsDaily(true); setPage('game'); }}
                    className="btn-primary text-lg py-3 px-10 rounded-xl shadow-glow-primary">
                    🎯 Start Today's Challenge
                  </button>
                ) : (
                  <div>
                    <p className="text-slate-400 text-sm mb-3">Sign in to see your assigned difficulty and track your score.</p>
                    <button onClick={() => setPage('register')} className="btn-primary py-3 px-8">
                      Create Free Account
                    </button>
                  </div>
                )}
              </div>
            </div>

            {/* Today's stats */}
            <div className="grid sm:grid-cols-3 gap-4">
              {[
                { label: "Today's Players", val: '3,241', icon: '👥' },
                { label: 'Completion Rate', val: '67%', icon: '✅' },
                { label: 'Avg Completion Time', val: '22:14', icon: '⏱️' },
              ].map(s => (
                <div key={s.label} className="stat-card text-center">
                  <p className="text-3xl mb-2">{s.icon}</p>
                  <p className="text-2xl font-display font-bold gradient-text">{s.val}</p>
                  <p className="text-slate-500 text-sm mt-1">{s.label}</p>
                </div>
              ))}
            </div>

            {/* Daily leaderboard */}
            <div className="glass rounded-2xl p-6">
              <h2 className="font-display font-bold text-white text-xl mb-4">📊 Today's Top Players</h2>
              <div className="space-y-2">
                {lb.slice(0, 5).map((p, i) => {
                  const isMe = p.id === user?.id;
                  const medals = ['🥇', '🥈', '🥉'];
                  return (
                    <div key={p.id} className={`leaderboard-row ${isMe ? 'my-row' : ''}`}>
                      <div className="w-8 text-center text-lg">{medals[i] || `#${i + 1}`}</div>
                      <span className="text-2xl">{p.avatar}</span>
                      <span className={`flex-1 font-semibold text-sm ${isMe ? 'text-primary' : 'text-white'}`}>{p.username}</span>
                      <span className="font-bold text-yellow-400 text-sm">{Math.floor(p.score / 10).toLocaleString()}</span>
                      <span className="text-slate-500 text-xs">pts</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Info cards */}
            <div className="grid sm:grid-cols-2 gap-4">
              <div className="glass rounded-2xl p-5">
                <h3 className="font-semibold text-white mb-3">📜 Today's Rules</h3>
                <ul className="space-y-2 text-sm text-slate-400">
                  <li className="flex items-start gap-2"><span className={`mt-0.5 font-bold ${diffCfg.color}`}>•</span>
                    <span>Your difficulty: <span className={`font-semibold ${diffCfg.color}`}>{dailyDifficulty}</span> — assigned by the system</span>
                  </li>
                  <li className="flex items-start gap-2"><span className="text-yellow-400 mt-0.5">•</span>
                    <span>Daily bonus: <span className="text-yellow-300 font-semibold">{bonusCfg.label} XP multiplier</span> — {bonusCfg.desc}</span>
                  </li>
                  <li className="flex items-start gap-2"><span className="text-primary mt-0.5">•</span>Score based on time + mistakes + hints</li>
                  <li className="flex items-start gap-2"><span className="text-primary mt-0.5">•</span>Difficulty varies day by day for each player</li>
                  <li className="flex items-start gap-2"><span className="text-primary mt-0.5">•</span>Rankings update immediately on completion</li>
                </ul>
              </div>
              <div className="glass rounded-2xl p-5">
                <h3 className="font-semibold text-white mb-3">🔥 Your Streak</h3>
                {user ? (
                  <div className="text-center py-2">
                    <p className="text-4xl font-display font-bold text-orange-400">{user.streak}</p>
                    <p className="text-slate-400 text-sm">day streak</p>
                    <p className="text-xs text-slate-500 mt-2">Best: {user.maxStreak || 0} days</p>
                    <div className="flex justify-center gap-1 mt-3 flex-wrap">
                      {Array.from({ length: 7 }).map((_, i) => {
                        const d = new Date();
                        d.setDate(d.getDate() - (6 - i));
                        const ds = d.toDateString();
                        const active = user.streakDays?.includes(ds);
                        return <div key={i} className={`streak-day ${active ? 'bg-orange-400' : 'bg-bg-elevated'}`} />;
                      })}
                    </div>
                    <p className="text-xs text-slate-600 mt-1">Last 7 days</p>
                  </div>
                ) : (
                  <p className="text-slate-500 text-sm">Sign in to track your streak.</p>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // MAIN APP
    // ============================================================

    function App() {
      const [page, setPage] = useState('landing');
      const [user, setUser] = useState(() => loadUser());
      const [toasts, setToasts] = useState([]);
      // Campaign state: phase = starting difficulty, round = 0-9 index
      const [campaign, setCampaign] = useState({ phase: 'Easy', round: 0 });
      // Daily challenge flag — when true, GamePage generates the seeded daily puzzle
      const [isDaily, setIsDaily] = useState(false);

      // Derive current round config from campaign
      const campaignRounds = CAMPAIGN_CONFIG[campaign.phase] || CAMPAIGN_CONFIG['Easy'];
      const currentRoundInfo = campaignRounds[campaign.round] || campaignRounds[0];
      const selectedDifficulty = currentRoundInfo.diff;
      const isBoss = currentRoundInfo.boss;

      // Compute today's daily difficulty for this user (seeded: userId + date)
      // Re-computes only when the user's ID changes (i.e. login/logout)
      const dailyDifficulty = useMemo(
        () => getDailyDifficulty(user?.id, new Date().toDateString()),
        [user?.id]
      );

      // Force logout on app mount/re-entry
      useEffect(() => {
        saveUser(null);
        setUser(null);
      }, []);

      // Reset isDaily when navigating away from game
      useEffect(() => {
        if (page !== 'game') setIsDaily(false);
      }, [page]);

      // Persist user
      useEffect(() => { saveUser(user); }, [user]);

      useEffect(() => {
        if (!user) return;
        const nextCampaign = getCampaignState(user);
        setCampaign(prev => (prev.phase === nextCampaign.phase && prev.round === nextCampaign.round ? prev : nextCampaign));
      }, [user?.id, user?.campaignProgress, user?.resumeProgress]);

      function addToast(message, type = 'info') {
        const id = Date.now() + Math.random();
        setToasts(t => [...t, { id, message, type }]);
        setTimeout(() => removeToast(id), 4000);
      }
      function removeToast(id) {
        setToasts(t => t.filter(toast => toast.id !== id));
      }

      async function handleLogin(u) {
        const progress = await apiLoadProgress(u);
        const mergedUser = {
          ...u,
          campaignProgress: progress?.campaignProgress || u.campaignProgress || {},
          resumeProgress: progress?.resumeProgress || u.resumeProgress || null,
        };
        setUser(mergedUser);
        setCampaign(getCampaignState(mergedUser));
        setPage('dashboard');
      }
      function handleLogout() {
        setUser(null);
        saveUser(null);
        setPage('landing');
        addToast('Logged out successfully', 'info');
      }

      // Route guard
      const protectedPages = ['dashboard', 'game', 'results'];
      useEffect(() => {
        if (protectedPages.includes(page) && !user) setPage('login');
      }, [page, user]);

      const commonProps = { setPage, user, setUser, addToast, campaign, setCampaign };

      return (
        <>
          <Navbar page={page} setPage={setPage} user={user} onLogout={handleLogout} />
          <main>
            {page === 'landing' && <LandingPage      {...commonProps} />}
            {page === 'login' && <LoginPage        {...commonProps} onLogin={handleLogin} />}
            {page === 'register' && <RegisterPage     {...commonProps} onLogin={handleLogin} />}
            {page === 'dashboard' && user && <DashboardPage   {...commonProps} />}
            {page === 'difficulty' && <DifficultyPage   {...commonProps} />}
            {page === 'game' && user && <GamePage
              difficulty={isDaily ? dailyDifficulty : selectedDifficulty}
              isBoss={!isDaily && isBoss}
              campaignPhase={isDaily ? null : campaign.phase}
              campaignRound={isDaily ? null : campaign.round}
              campaignTotal={isDaily ? 0 : campaignRounds.length}
              isDaily={isDaily}
              {...commonProps} />}
            {page === 'daily' && <DailyChallengePage {...commonProps} setIsDaily={setIsDaily} dailyDifficulty={dailyDifficulty} />}
            {page === 'results' && user && <ResultsPage  {...commonProps} />}
            {page === 'leaderboard' && <LeaderboardPage  {...commonProps} />}
            {page === 'admin' && <AdminPage setPage={setPage} />}
          </main>
          <Toast toasts={toasts} removeToast={removeToast} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
